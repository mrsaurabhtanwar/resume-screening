name: Deploy AI Resume Screening Engine to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cvranking-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: Deploy Container to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Execute SSH Commands on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/cvranking
            cd ~/cvranking

            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE_CONTENT }}
            EOF

            cat << 'EOF' > docker-compose.yml
            services:
              cvranking-backend:
                image: ${{ secrets.DOCKER_USERNAME }}/cvranking-backend:latest
                container_name: cvranking_api
                restart: unless-stopped
                ports:
                  - "8080:8080"
                env_file:
                  - .env
                volumes:
                  - faiss_storage:/app/storage
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8080/"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 20s

            volumes:
              faiss_storage:
                driver: local
            EOF

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            docker compose pull
            docker compose up -d --remove-orphans

            docker image prune -f
